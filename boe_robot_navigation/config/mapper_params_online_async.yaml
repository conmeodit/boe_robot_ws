slam_toolbox:
  ros__parameters:
    # Bộ giải tối ưu pose graph.
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Tên frame và topic phải trùng với mô hình BOE.
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping
    use_map_saver: true

    # Gazebo LiDAR của BOE chạy 10 Hz, tầm đo tối đa 8 m.
    throttle_scans: 1
    scan_queue_size: 1
    min_laser_range: 0.08
    max_laser_range: 7.5
    minimum_time_interval: 0.10

    # Robot BOE nhỏ nên dùng map 2.5 cm/pixel và nhận pose mới sớm.
    resolution: 0.025
    map_update_interval: 1.0
    minimum_travel_distance: 0.03
    minimum_travel_heading: 0.15

    # TF map -> odom do SLAM Toolbox xuất.
    transform_publish_period: 0.02
    transform_timeout: 0.20
    tf_buffer_duration: 30.0

    # Scan matching và loop closure.
    use_scan_matching: true
    use_scan_barycenter: true
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 4.0
    link_match_minimum_response_fine: 0.10
    link_scan_maximum_distance: 0.50
    loop_search_maximum_distance: 2.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation scan matcher.
    correlation_search_space_dimension: 0.20
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.03

    # Loop closure scan matcher.
    loop_search_space_dimension: 4.0
    loop_search_space_resolution: 0.025
    loop_search_space_smear_deviation: 0.03

    # Trọng số và ngưỡng scan matcher.
    distance_variance_penalty: 0.15
    angle_variance_penalty: 0.25
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 3
    occupancy_threshold: 0.20

    debug_logging: false
    stack_size_to_use: 40000000
    enable_interactive_mode: true
